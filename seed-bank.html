<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씨앗 은행 슬라이드</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
/* 방향: 흰 종이 위 음악 스튜디오. 카테고리마다 고유 색, 직접 눌러 듣고 고르는 인터랙티브 덱 */
:root{
  color-scheme: light;
  --bg:#ffffff; --ink:#15132b; --sub:#55536f; --faint:#9a98b0; --line:#ecebf3; --panel:#f7f6fb;
  --genre:#e11d48; --mood:#7c3aed; --tempo:#0891b2; --rhythm:#ea580c; --inst:#059669; --vocal:#db2777; --prod:#2563eb; --era:#b45309;
  --display:'Black Han Sans','Noto Sans KR',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{ font-family:var(--body); background:var(--bg); color:var(--ink); overflow:hidden; letter-spacing:-0.01em; }
button{ font-family:inherit; cursor:pointer; color:inherit; }
:focus-visible{ outline:3px solid #a5b4fc; outline-offset:2px; }

/* 배경 오선 */
.staff-bg{ position:fixed; inset:0; z-index:0; pointer-events:none;
  background:repeating-linear-gradient(180deg, transparent 0 46px, #f3f2f8 46px 47px); opacity:.7; }

/* 덱 */
.deck{ position:relative; z-index:1; width:100%; height:100%; overflow:hidden; }
.slide{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:30px 48px 86px; opacity:0; visibility:hidden; transform:translateX(60px);
  transition:opacity .4s ease, transform .4s ease, visibility .4s; overflow-y:auto; }
.slide.active{ opacity:1; visibility:visible; transform:none; }
.slide.prev{ transform:translateX(-60px); }
.inner{ width:100%; max-width:1140px; display:flex; flex-direction:column; align-items:center; gap:18px; margin:auto; }

.tag{ font-size:12px; font-weight:700; letter-spacing:3px; padding:5px 15px; border-radius:20px; border:1.5px solid currentColor; }
h1{ font-family:var(--display); font-weight:400; font-size:clamp(40px,6.4vw,84px); line-height:1.08; text-align:center; letter-spacing:-0.01em; }
h2{ font-family:var(--display); font-weight:400; font-size:clamp(28px,3.8vw,48px); line-height:1.2; text-align:center; }
.sub{ font-size:clamp(15px,1.6vw,19px); color:var(--sub); text-align:center; line-height:1.75; max-width:760px; }
.sub b{ color:var(--ink); }
.c-genre{color:var(--genre)} .c-mood{color:var(--mood)} .c-tempo{color:var(--tempo)} .c-rhythm{color:var(--rhythm)}
.c-inst{color:var(--inst)} .c-vocal{color:var(--vocal)} .c-prod{color:var(--prod)} .c-era{color:var(--era)}

/* 표지 이퀄라이저 */
.eq{ display:flex; gap:7px; align-items:flex-end; height:120px; }
.eq span{ width:16px; border-radius:8px; height:30%; }

/* 두 칸 */
.two{ display:grid; grid-template-columns:1fr 1fr; gap:22px; width:100%; max-width:960px; }
.field{ border:2px solid var(--line); border-radius:24px; padding:22px; background:#fff; box-shadow:0 10px 30px rgba(21,19,43,.06); display:flex; flex-direction:column; gap:12px; }
.field h3{ font-size:20px; font-weight:900; display:flex; align-items:center; gap:10px; }
.field .k{ font-size:13px; color:var(--faint); font-weight:700; }
.code{ font-family:'Consolas','D2Coding',monospace; font-size:14.5px; line-height:1.8; background:var(--panel); border-radius:14px; padding:14px 16px; color:#2b2770; white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; }
.code .st{ color:var(--rhythm); font-weight:700; }

/* 공식 */
.formula{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
.fpart{ padding:12px 18px; border-radius:16px; font-weight:900; font-size:clamp(15px,1.6vw,19px); color:#fff; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:96px; }
.fpart small{ font-size:11px; font-weight:700; opacity:.85; letter-spacing:1px; }
.plus{ font-size:24px; color:var(--faint); font-weight:900; }
.weight{ display:flex; align-items:flex-end; gap:8px; height:80px; }
.weight i{ display:block; width:96px; border-radius:10px 10px 4px 4px; background:linear-gradient(180deg,#c7c4ff,#eceaff); }
.weight-cap{ font-size:14px; color:var(--sub); font-weight:700; }

/* 칩 그리드 */
.groups{ width:100%; display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
.group{ background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.group h4{ font-size:14px; font-weight:900; color:var(--sub); }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:7px 13px; font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px; transition:transform .12s, background .15s, border-color .15s, color .15s; }
.chip em{ font-style:normal; font-weight:500; font-size:12px; color:var(--faint); font-family:'Consolas','D2Coding',monospace; }
.chip:hover{ transform:translateY(-2px); border-color:var(--cc,#c7c4ff); }
.chip[aria-pressed="true"]{ background:var(--cc); border-color:var(--cc); color:#fff; }
.chip[aria-pressed="true"] em{ color:rgba(255,255,255,.85); }
.chip[aria-pressed="true"]::before{ content:'✓'; }
.detail{ width:100%; max-width:900px; min-height:58px; border-radius:16px; background:var(--panel); padding:14px 18px; font-size:15.5px; line-height:1.65; color:var(--sub); display:flex; gap:12px; align-items:center; }
.detail b{ color:var(--ink); }
.detail code{ font-family:'Consolas','D2Coding',monospace; background:#fff; border:1px solid var(--line); border-radius:8px; padding:2px 8px; color:#2b2770; font-size:14px; }
.cart-hint{ font-size:13px; color:var(--faint); font-weight:700; }

/* 분위기 지도 */
.moodmap{ position:relative; width:100%; max-width:820px; aspect-ratio:16/9; border-radius:24px; border:1.5px solid var(--line);
  background:
    linear-gradient(90deg, rgba(55,48,163,.07), rgba(250,204,21,.12)),
    linear-gradient(0deg, rgba(255,255,255,0), rgba(225,29,72,.06));
  max-height:52vh; }
.axis{ position:absolute; font-size:12.5px; font-weight:900; color:var(--faint); }
.axis.l{ left:12px; top:50%; transform:translateY(-50%); } .axis.r{ right:12px; top:50%; transform:translateY(-50%); }
.axis.t{ top:10px; left:50%; transform:translateX(-50%); } .axis.b{ bottom:10px; left:50%; transform:translateX(-50%); }
.moodmap::before{ content:''; position:absolute; left:50%; top:8%; bottom:8%; border-left:1.5px dashed #dddbe9; }
.moodmap::after{ content:''; position:absolute; top:50%; left:6%; right:6%; border-top:1.5px dashed #dddbe9; }
.mdot{ position:absolute; transform:translate(-50%,-50%); --cc:var(--mood); z-index:2; white-space:nowrap; }

/* 템포 */
.tempo-box{ width:100%; max-width:900px; display:flex; flex-direction:column; gap:16px; align-items:center; }
.bpm-big{ font-family:var(--display); font-size:clamp(64px,10vw,120px); line-height:1; color:var(--tempo); display:flex; align-items:baseline; gap:10px; }
.bpm-big small{ font-family:var(--body); font-size:22px; font-weight:900; color:var(--faint); }
.beat-dot{ width:22px; height:22px; border-radius:50%; background:#e0f2f7; transition:background .05s, transform .05s; }
.beat-dot.on{ background:var(--tempo); transform:scale(1.25); }
.slider-wrap{ position:relative; width:100%; padding-top:34px; }
input[type=range]{ width:100%; accent-color:var(--tempo); height:28px; }
.marks{ position:absolute; left:0; right:0; top:0; height:30px; }
.mark{ position:absolute; transform:translateX(-50%); font-size:11.5px; font-weight:700; color:var(--sub); background:#fff; border:1px solid var(--line); border-radius:8px; padding:2px 6px; white-space:nowrap; cursor:pointer; }
.mark:hover{ border-color:var(--tempo); color:var(--tempo); }
.btn{ border:none; border-radius:14px; padding:11px 20px; font-weight:900; font-size:15px; background:var(--ink); color:#fff; display:inline-flex; gap:8px; align-items:center; }
.btn.ghost{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
.btn.t{ background:var(--tempo); } .btn.r{ background:var(--rhythm); }
.row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }

/* 시퀀서 */
.seq{ width:100%; max-width:900px; display:flex; flex-direction:column; gap:8px; background:#fff; border:1.5px solid var(--line); border-radius:22px; padding:16px; }
.seq-row{ display:grid; grid-template-columns:72px repeat(16,1fr); gap:5px; align-items:center; }
.seq-row b{ font-size:13px; color:var(--sub); }
.cell{ aspect-ratio:1; border-radius:7px; background:#f3f2f8; }
.cell.q{ background:#ebe9f3; }
.cell.on.k{ background:var(--rhythm); } .cell.on.s{ background:#f59e0b; } .cell.on.h{ background:#fbbf77; }
.cell.roll{ background:repeating-linear-gradient(90deg,#fbbf77 0 40%, transparent 40% 60%, #fbbf77 60% 100%); }
.cell.now{ outline:3px solid var(--ink); outline-offset:-1px; }

/* 가사 */
.lyric{ width:100%; max-width:760px; font-size:17px; line-height:2; background:#fff; border:1.5px solid var(--line); border-radius:22px; padding:20px 24px; }
.mt{ display:inline-block; font-family:'Consolas','D2Coding',monospace; font-weight:700; color:var(--rhythm); background:#fff1e6; border-radius:8px; padding:0 8px; cursor:pointer; border:none; font-size:15px; }
.mt.p{ color:var(--vocal); background:#fde7f1; }

/* 비교 */
.vs{ display:grid; grid-template-columns:1fr 1fr; gap:18px; width:100%; max-width:980px; }
.vs .card{ border-radius:22px; padding:20px; border:2px solid var(--line); display:flex; flex-direction:column; gap:10px; background:#fff; }
.vs .bad{ border-color:#fecdd3; } .vs .good{ border-color:#a7f3d0; }
.vs h3{ font-size:18px; font-weight:900; }
.mistakes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; width:100%; max-width:980px; }
.mis{ background:var(--panel); border-radius:16px; padding:12px 14px; font-size:14px; line-height:1.55; color:var(--sub); }
.mis b{ display:block; color:var(--ink); font-size:15px; margin-bottom:2px; }

/* 트렌드 */
.bars{ width:100%; max-width:720px; display:flex; flex-direction:column; gap:9px; }
.bar-row{ display:grid; grid-template-columns:120px 1fr 52px; gap:10px; align-items:center; font-size:14.5px; font-weight:700; }
.bar-track{ height:22px; background:#f3f2f8; border-radius:99px; overflow:hidden; }
.bar-fill{ height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#fda4af,var(--genre)); }
.bar-row .v{ text-align:right; font-variant-numeric:tabular-nums; color:var(--sub); }
.trend-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; width:100%; max-width:1000px; }
.tcard{ border-radius:18px; padding:14px 16px; background:#fff; border:1.5px solid var(--line); display:flex; flex-direction:column; gap:4px; }
.tcard b{ font-size:16px; } .tcard span{ font-size:13.5px; color:var(--sub); line-height:1.55; } .tcard code{ font-size:12.5px; color:#2b2770; font-family:'Consolas','D2Coding',monospace; }
.src{ font-size:12px; color:var(--faint); text-align:center; }

/* 조립기 */
.builder{ width:100%; max-width:1100px; display:grid; grid-template-columns:1.1fr 1fr; gap:18px; align-items:start; }
.picked{ display:flex; flex-direction:column; gap:8px; }
.pk{ display:grid; grid-template-columns:72px 1fr; gap:8px; align-items:start; }
.pk > b{ font-size:13px; font-weight:900; padding-top:6px; }
.pk .chips{ min-height:32px; }
.pk .empty{ font-size:13px; color:#c3c1d3; padding-top:6px; }
.chip.rm{ --cc:#15132b; }
.out{ background:#15132b; color:#e9e7ff; border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:12px; }
.out .code{ background:#221f42; color:#fff; min-height:110px; font-size:15px; }
.meter{ display:flex; gap:4px; } .meter i{ flex:1; height:8px; border-radius:99px; background:#2f2b57; }
.meter i.on{ background:#34d399; } .meter i.on.w{ background:#fbbf24; } .meter i.on.x{ background:#fb7185; }
.warns{ display:flex; flex-direction:column; gap:6px; font-size:13.5px; line-height:1.5; }
.warns div{ background:#221f42; border-radius:10px; padding:7px 10px; }
.out label{ font-size:12.5px; color:#a5a3c9; font-weight:700; }
.out input{ width:100%; border:none; border-radius:10px; padding:9px 12px; background:#221f42; color:#fff; font-family:inherit; font-size:14px; }
.presets{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }

/* 마무리 */
.end-quote{ font-family:var(--display); font-size:clamp(32px,5vw,62px); line-height:1.25; text-align:center; }

/* 내비 */
.nav{ position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; align-items:center; justify-content:center; gap:16px; padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background:linear-gradient(0deg,#fff 60%,rgba(255,255,255,0)); }
.nav-btn{ width:48px; height:48px; border-radius:50%; border:1.5px solid var(--line); background:#fff; font-size:18px; font-weight:900; }
.nav-btn:disabled{ opacity:.3; cursor:default; }
.slide-num{ font-weight:900; color:var(--sub); font-variant-numeric:tabular-nums; min-width:70px; text-align:center; }
.cart{ position:fixed; top:14px; right:16px; z-index:5; border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:8px 14px; font-weight:900; font-size:13.5px; display:flex; gap:6px; align-items:center; box-shadow:0 6px 18px rgba(21,19,43,.08); }
.cart i{ font-style:normal; background:var(--ink); color:#fff; border-radius:99px; padding:1px 8px; font-variant-numeric:tabular-nums; }

@media (max-width:760px){
  .slide{ padding:56px 16px 92px; align-items:flex-start; }
  .two, .vs, .builder{ grid-template-columns:1fr; }
  .seq-row{ grid-template-columns:46px repeat(16,1fr); gap:3px; }
  .weight i{ width:52px; }
  .moodmap{ aspect-ratio:4/5; max-height:none; }
  .mark{ font-size:10px; padding:1px 4px; }
}
@media (prefers-reduced-motion:reduce){ .slide{ transition:none; transform:none; } }

/* ── 씨앗 은행 전용 ── */
:root{ --word:#059669; --concept:#7c3aed; --sent:#2563eb; --test:#ea580c; }
.c-word{color:var(--word)} .c-concept{color:var(--concept)} .c-sent{color:var(--sent)} .c-test{color:var(--test)}

/* 표지 씨앗 */
.grow{ width:220px; height:200px; }

/* 뒤집는 카드 */
.flips{ display:grid; grid-template-columns:repeat(2,1fr); gap:18px; width:100%; max-width:780px; }
.flip{ perspective:1200px; border:none; background:none; padding:0; text-align:left; min-height:300px; }
.flip-in{ position:relative; width:100%; height:100%; min-height:300px; transition:transform .6s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d; }
.flip.on .flip-in{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; border-radius:24px; padding:22px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; gap:10px; border:2px solid var(--line); background:#fff; box-shadow:0 10px 30px rgba(21,19,43,.06); }
.face.back{ transform:rotateY(180deg); background:var(--panel); }
.face .kind{ font-size:13px; font-weight:900; letter-spacing:2px; }
.face .big{ font-family:var(--display); font-size:clamp(26px,2.6vw,36px); line-height:1.25; }
.face p{ font-size:15px; line-height:1.6; color:var(--sub); }
.face .hint{ margin-top:auto; font-size:13px; font-weight:700; color:var(--faint); }
.face.back .mu{ font-size:16px; line-height:1.65; color:var(--ink); background:#fff; border-radius:14px; padding:12px 14px; }

/* 감별기 */
.tester{ display:grid; grid-template-columns:260px 1fr; gap:22px; width:100%; max-width:980px; align-items:center; }
.plant{ width:100%; max-width:260px; height:auto; }
.seed-input{ width:100%; border:2px solid var(--line); border-radius:16px; padding:12px 16px; font-size:20px; font-weight:900; font-family:inherit; outline:none; color:var(--ink); }
.seed-input:focus{ border-color:var(--test); }
.switches{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sw{ display:flex; align-items:center; gap:12px; text-align:left; border:2px solid var(--line); background:#fff; border-radius:16px; padding:12px 14px; }
.sw .knob{ width:44px; height:26px; border-radius:99px; background:#e5e4ee; position:relative; flex-shrink:0; transition:background .2s; }
.sw .knob::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .2s; }
.sw[aria-pressed="true"]{ border-color:var(--test); background:#fff7ed; }
.sw[aria-pressed="true"] .knob{ background:var(--test); }
.sw[aria-pressed="true"] .knob::after{ left:21px; }
.sw b{ display:block; font-size:15px; } .sw span{ font-size:12.5px; color:var(--sub); line-height:1.4; }
.verdict{ font-size:18px; font-weight:900; padding:12px 16px; border-radius:16px; background:var(--panel); }

/* 단어 씨앗 + 양파 */
.word-wrap{ display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:20px; width:100%; max-width:1120px; align-items:start; }
.filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.wgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px; max-height:52vh; overflow-y:auto; padding:4px; }
.wbtn{ border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:10px 8px; display:flex; flex-direction:column; gap:3px; align-items:flex-start; text-align:left; transition:transform .12s, border-color .15s; }
.wbtn:hover{ transform:translateY(-2px); border-color:var(--word); }
.wbtn b{ font-size:15.5px; font-weight:900; } .wbtn small{ font-size:11px; font-weight:700; color:var(--faint); }
.wbtn[aria-current="true"]{ border-color:var(--word); background:#ecfdf5; }
.mine{ display:flex; gap:8px; align-items:center; margin-bottom:10px; background:#ecfdf5; border:2px dashed var(--word); border-radius:16px; padding:8px 10px; }
.mine label{ font-size:13px; font-weight:900; color:var(--word); white-space:nowrap; }
.mine input{ flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; font-family:inherit; font-size:16px; font-weight:700; outline:none; background:#fff; color:var(--ink); }
.mine input:focus{ border-color:var(--word); }
.mine button{ border:none; border-radius:12px; padding:9px 14px; font-weight:900; font-size:14px; background:var(--word); color:#fff; white-space:nowrap; }
.mine.on{ background:#d1fae5; border-style:solid; }
.mine-ans{ display:block; width:100%; margin-top:10px; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font-family:inherit; font-size:15px; line-height:1.6; resize:vertical; outline:none; background:#fff; color:var(--ink); }
.mine-ans:focus{ border-color:var(--word); }
.onion-panel{ background:#fff; border:2px solid var(--line); border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:12px; position:sticky; top:0; }
.onion-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.onion-head b{ font-family:var(--display); font-size:30px; font-weight:400; }
.onion-svg{ width:100%; max-width:260px; margin:0 auto; display:block; cursor:pointer; }
.onion-svg circle{ transition:fill .3s, stroke-width .2s; stroke:#fff; stroke-width:3; }
.onion-svg circle:hover{ stroke:#15132b; }
.layer-out{ min-height:110px; border-radius:16px; background:var(--panel); padding:12px 14px; font-size:15px; line-height:1.65; }
.layer-out .ln{ font-size:12px; font-weight:900; letter-spacing:1px; display:block; margin-bottom:2px; }
.layer-out .q{ color:var(--concept); font-weight:700; }
.whoai{ font-size:11px; font-weight:900; padding:2px 8px; border-radius:99px; background:#e0f2fe; color:#0369a1; }
.whome{ font-size:11px; font-weight:900; padding:2px 8px; border-radius:99px; background:var(--concept); color:#fff; }

/* 개념 씨앗 */
.pair-list{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
.stage{ width:100%; max-width:920px; display:grid; grid-template-columns:1fr 200px 1fr; gap:10px; align-items:center; }
.node{ border-radius:24px; padding:22px 16px; text-align:center; font-family:var(--display); font-size:clamp(26px,3vw,40px); color:#fff; min-height:120px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
.node small{ font-family:var(--body); font-size:13px; font-weight:700; opacity:.9; }
.node.a{ background:var(--concept); } .node.b{ background:#c026d3; }
.link{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.link .sym{ font-size:48px; font-weight:900; color:var(--ink); line-height:1; }
.link .lt{ font-size:13px; font-weight:900; color:var(--sub); text-align:center; }
.song3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:920px; }
.song3 div{ border-radius:18px; padding:12px 14px; background:var(--panel); font-size:14.5px; line-height:1.55; }
.song3 b{ display:block; font-size:12.5px; letter-spacing:1px; margin-bottom:4px; }

/* 개념 씨앗: 과정 3단계 */
.con-name{ font-family:var(--display); font-size:clamp(26px,3vw,40px); color:var(--concept); text-align:center; line-height:1.25; }
.con-name small{ display:block; font-family:var(--body); font-size:13px; font-weight:700; color:var(--faint); margin-top:4px; }
.steps3{ width:100%; max-width:1000px; display:grid; grid-template-columns:1fr 36px 1fr 36px 1fr; gap:6px; align-items:stretch; }
.st3{ border-radius:20px; padding:14px 16px; background:#fff; border:2px solid #ddd6fe; display:flex; flex-direction:column; gap:6px; }
.st3 b{ font-size:12.5px; font-weight:900; letter-spacing:1px; color:var(--concept); }
.st3 span{ font-size:15px; line-height:1.55; font-weight:700; }
.st3 em{ font-style:normal; font-size:12px; font-weight:900; color:#fff; background:var(--concept); border-radius:99px; padding:2px 9px; align-self:flex-start; }
.st3:nth-of-type(3){ background:#f5f3ff; } .st3:nth-of-type(5){ background:#ede9fe; }
.arr{ display:grid; place-items:center; font-size:26px; font-weight:900; color:var(--concept); }
.con-why, .con-story, .con-mu{ max-width:1000px; }
.con-story{ background:#fffbeb; } .con-mu{ background:#ecfdf5; }
@media (max-width:760px){ .steps3{ grid-template-columns:1fr; } .arr{ transform:rotate(90deg); } }

/* 문장 씨앗 */
.sent-list{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:1000px; }
.tokens{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; font-size:clamp(20px,2.4vw,30px); font-weight:900; max-width:980px; }
.tok{ border:none; background:#eef2ff; color:var(--ink); border-radius:12px; padding:6px 12px; transition:background .15s, transform .15s; }
.tok:hover{ transform:translateY(-2px); }
.tok[aria-pressed="true"]{ background:var(--sent); color:#fff; }
.techs{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.lyric-out{ width:100%; max-width:820px; border-radius:20px; background:#15132b; color:#fff; padding:18px 22px; font-size:clamp(17px,1.9vw,22px); line-height:1.7; min-height:84px; }
.ctx{ width:100%; max-width:820px; font-size:14.5px; line-height:1.65; color:var(--sub); background:var(--panel); border-radius:16px; padding:11px 15px; }
.ctx b{ color:var(--ink); }
.lyric-out small{ display:block; font-size:12.5px; color:#a5a3c9; font-weight:700; margin-bottom:4px; }

/* 담기 버튼 */
.keep{ border:none; border-radius:12px; padding:8px 14px; font-weight:900; font-size:14px; color:#fff; }
.keep[aria-pressed="true"]{ background:var(--ink) !important; }

/* 조립기 */
.seed-items{ display:flex; flex-direction:column; gap:8px; }
.seed-item{ display:flex; align-items:center; gap:10px; border:2px solid var(--line); border-radius:16px; padding:10px 12px; background:#fff; text-align:left; width:100%; }
.seed-item[aria-pressed="true"]{ border-color:var(--word); background:#ecfdf5; }
.seed-item .ty{ font-size:11.5px; font-weight:900; padding:3px 9px; border-radius:99px; color:#fff; flex-shrink:0; }
.seed-item .tx{ flex:1; font-size:15px; font-weight:700; }
.seed-item .x{ border:none; background:none; color:var(--faint); font-weight:900; font-size:16px; }

@media (max-width:760px){
  .flips, .tester, .word-wrap, .song3{ grid-template-columns:1fr; }
  .stage{ grid-template-columns:1fr; }
  .switches{ grid-template-columns:1fr; }
  .wgrid{ max-height:none; }
  .onion-panel{ position:static; }
  .flip, .flip-in{ min-height:260px; }
}
/* 세로 태블릿: 단어 목록 아래에 양파 패널(양파 왼쪽 · 설명 오른쪽) */
@media (min-width:761px) and (max-width:1000px){
  .word-wrap{ grid-template-columns:minmax(0,1fr); }
  .wgrid{ max-height:34vh; }
  .onion-panel{ position:static; display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-areas:"head head" "svg ctrl" "svg out"; gap:12px 20px; align-items:start; }

  .onion-svg{ grid-area:svg; align-self:center; }
  .onion-panel > .row{ grid-area:ctrl; justify-content:flex-start; }
  .layer-out{ grid-area:out; }
}

  var WX={"밀도": ["密(빽빽할 밀) + 度(정도 도): 얼마나 빽빽하게 차 있는지. 아르키메데스가 왕관을 물에 넣어 순금인지 가려냈다는 이야기가 전해져요.", "사회: “인구 밀도가 높다” · 일상: “오늘 수업 밀도 있었어”"], "포화": ["飽(배부를 포) + 和(화할 화): 배가 부를 만큼 꽉 차서 더 받아들일 수 없는 상태. 바닷물을 말려 소금을 얻는 염전도 이 원리를 이용해요.", "뉴스: “주차장이 포화 상태예요” · 일상: “시험 기간이라 머리가 포화야”"], "풍화": ["風(바람 풍) + 化(될 화): 바람과 물 같은 자연에 의해 바뀜. 오래된 비석의 글씨가 닳아 흐려지는 것도 풍화예요.", "표현: “기억이 풍화되다” · 일상: 오래된 돌담과 건물"], "대륙 이동": ["大陸(큰 땅) + 移動(옮겨 움직임). 1912년 베게너가 주장했을 때는 비웃음을 샀지만, 나중에 판 구조론으로 인정받았어요.", "일상: 세계 지도를 퍼즐처럼 맞춰 보기 · 다큐멘터리, 화석 이야기"], "굴절": ["屈(굽을 굴) + 折(꺾을 절): 굽어서 꺾임. 물속 막대가 꺾여 보이는 현상은 아주 옛날부터 알려져 있었어요.", "일상: 안경, 돋보기 렌즈 · 표현: “굴절된 시선”"], "파동": ["波(물결 파) + 動(움직일 동): 물결처럼 움직임. 호수에 돌을 던지면 퍼지는 물결이 가장 쉬운 예예요.", "음악: 소리는 파동이에요 · 뉴스: “경제에 큰 파동” · 응원: 경기장 파도타기"], "이온": ["영어 ion, 그리스어로 “가는 것”이라는 뜻. 1834년 패러데이가 전기를 따라 움직이는 알갱이에 이 이름을 붙였어요.", "일상: 이온 음료, “음이온” 드라이기 광고"], "광합성": ["光(빛 광) + 合(합할 합) + 成(이룰 성): 빛으로 합쳐 만들어 냄. 1600년대 반 헬몬트의 버드나무 실험에서 “흙을 먹고 자라는 게 아니구나”를 알게 됐어요.", "일상: 햇볕을 쬐며 “광합성 중”이라고 농담할 때"], "순환": ["循(돌 순) + 環(고리 환): 고리처럼 돌고 돎. 1628년 하비가 피가 온몸을 돌아 다시 심장으로 온다는 것을 밝혔어요.", "사회: 경제 순환 · 일상: 순환 버스, 계절의 순환"], "정전기": ["靜(고요할 정) + 電(전기 전) + 氣(기운 기): 흐르지 않고 머문 전기. 고대 그리스 사람들이 호박(보석)을 문지르면 먼지가 붙는 것을 보았고, 영어 electricity도 그리스어 “호박”에서 왔어요.", "일상: 겨울철 문고리의 “찌릿”, 풍선에 붙는 머리카락"], "저항": ["抵(막을 저) + 抗(겨룰 항): 막아서 맞섬. 1827년 옴이 전압, 전류, 저항의 관계(옴의 법칙)를 정리했어요.", "역사: 독립운동의 “저항” · 일상: 달릴 때 느끼는 “공기 저항”, “저항감이 든다”"], "연주 시차": ["年周(일 년 동안 돎) + 視差(보는 차이). 1838년 베셀이 처음으로 별의 연주 시차를 재서 별까지의 거리를 구했어요.", "일상: 한쪽 눈씩 감고 손가락을 보면 움직여 보이는 것"], "우주 팽창": ["宇宙(우주) + 膨脹(부풀어 커짐). 1929년 허블이 멀리 있는 은하일수록 빨리 멀어진다는 것을 발견했어요.", "일상: 부풀어 오르는 풍선 · 표현: “세계관이 팽창한다”"], "순환소수": ["循環(돌고 돎) + 小數(작은 수): 소수점 아래가 고리처럼 돌고 도는 수.", "일상: 계산기로 1 ÷ 3을 하면 끝없이 나오는 0.3333… · “무한 반복”"], "부등식": ["不(아닐 부) + 等(같을 등) + 式(식 식): 같지 않음을 나타낸 식. 부등호 <, >는 1631년에 나온 해리엇의 책에서 쓰이기 시작했어요.", "일상: 시소, “키 140cm 이상 탑승 가능” 같은 놀이기구 안내"], "연립방정식": ["聯立(나란히 세움) + 方程式(방정식). 약 2000년 전 중국 수학책 『구장산술』의 “방정” 장에서 “방정식”이라는 말이 왔어요.", "일상: “닭과 토끼 다리가 모두 몇 개” 같은 문제, 장보기 계산"], "기울기": ["순우리말 “기울다”에 “-기”가 붙은 말. 얼마나 기울었는지를 수로 나타내요.", "일상: 경사로, 도로의 오르막 표지판 · 표현: “마음이 한쪽으로 기울다”"], "닮음": ["순우리말 “닮다”에서 온 말. 고대 그리스의 탈레스가 그림자 길이로 피라미드 높이를 쟀다는 이야기가 전해져요.", "일상: 지도의 축척, 사진 확대·축소 · “엄마를 닮았네”"], "피타고라스 정리": ["고대 그리스 수학자 피타고라스의 이름이 붙었지만, 그보다 오래된 바빌로니아 점토판에도 비슷한 수의 관계가 적혀 있어요.", "일상: TV·휴대폰 화면 크기(대각선 길이), 지름길 거리 계산"], "확률": ["確(굳을 확) + 率(비율 률): 확실한 정도를 나타낸 비율. 1654년 파스칼과 페르마가 도박 문제를 편지로 주고받으며 확률을 연구했어요.", "뉴스: “내일 비 올 확률 60%” · 게임: 아이템 뽑기 확률"], "함수": ["函(상자 함) + 數(셈 수). 원래 영어 function을 옮긴 말인데, “넣으면 규칙대로 나오는 상자”로 기억하면 쉬워요. 라이프니츠가 function이라는 말을 처음 썼어요.", "일상: 동전을 넣으면 음료가 나오는 자판기 · 컴퓨터: 엑셀 함수"], "기회비용": ["機會(기회) + 費用(비용): 기회를 잃은 것도 비용이라는 뜻.", "일상: “게임 한 시간의 기회비용은 공부 한 시간” · 진로 선택"], "희소성": ["稀(드물 희) + 少(적을 소) + 性(성질 성): 드물고 적은 성질.", "일상: 한정판 운동화, 게임의 희귀 아이템"], "균형 가격": ["均衡(고르게 맞춤, 저울이 평평함) + 價格(값).", "일상: 중고 거래에서 사는 사람과 파는 사람이 합의한 값"], "권력 분립": ["權力(권력) + 分立(나누어 세움). 1748년 몽테스키외가 『법의 정신』에서 권력을 나눠야 자유가 지켜진다고 했어요.", "학교: 학생회와 선생님, 학급 회의가 서로 견제하는 것"], "세계화": ["世界(세계) + 化(될 화): 세계가 하나로 이어져 감. 1980~90년대부터 널리 쓰이기 시작했어요.", "일상: K-팝, 해외 직구, 외국 OTT 드라마"], "사회 변동": ["社會(사회) + 變動(바뀌어 움직임).", "일상: 스마트폰이 생긴 뒤 달라진 소통, 부모님 학창 시절과 지금"], "화자": ["話(말할 화) + 者(사람 자): 말하는 사람.", "노래: 노래 가사 속 “나” · 웹툰의 1인칭 주인공"], "서술자": ["敍述(차례로 풀어 말함) + 者(사람): 이야기를 들려주는 사람.", "영상: 다큐의 내레이션, 웹툰의 해설 말풍선"], "타당성": ["妥當(사리에 마땅함) + 性(성질).", "일상: 토론, “그 말 근거 있어?”, 광고 문구 따져 보기"], "반어": ["反(돌이킬 반) + 語(말씀 어): 반대로 하는 말. 영어 irony는 그리스어로 “시치미 떼기”라는 말에서 왔어요.", "일상: 혼낼 때 “참~ 잘했다”"], "역설": ["逆(거스를 역) + 說(말씀 설): 거꾸로 된 듯한 말. 영어 paradox는 그리스어로 “생각을 넘어서는 것”이라는 뜻이에요.", "속담: “바쁠수록 돌아가라”, “지는 게 이기는 것”"], "교류": ["交(사귈 교) + 流(흐를 류): 서로 오가며 흐름.", "일상: 교환 학생, 자매결연 학교 · 과학: 전기의 “교류”"], "혁명": ["革(고칠 혁) + 命(목숨·운명 명): 하늘이 내린 운명을 바꾼다는 옛말에서 왔어요.", "뉴스: “스마트폰 혁명”, “AI 혁명” · 역사: 산업 혁명"], "독립": ["獨(홀로 독) + 立(설 립): 홀로 섬.", "일상: 독립 영화, “경제적 독립”, 혼자 방 쓰기"], "계승": ["繼(이을 계) + 承(이을 승): 이어서 받음.", "일상: 전통 계승, 할머니 손맛 이어받기"], "쉼표": ["쉼 + 標(표 표): 쉬는 자리를 나타내는 표시.", "국어: 문장 부호 쉼표 · 표현: “인생의 쉼표”"], "불협화음": ["不(아닐 불) + 協和(어울림) + 音(소리): 어울리지 않는 소리.", "뉴스: “팀 안의 불협화음” · 일상: 친구 사이 삐걱거림"], "여백": ["餘(남을 여) + 白(흰 백): 남은 흰 부분.", "일상: 공책 여백, 포스터 디자인 · 표현: “여백의 미”"], "명암": ["明(밝을 명) + 暗(어두울 암): 밝음과 어두움.", "뉴스: “정책의 명암” · 사진: 그림자 효과"], "관성": ["慣(익숙할 관) + 性(성질 성): 하던 대로 하려는 성질. 갈릴레이가 생각해 내고 뉴턴이 운동 제1법칙으로 정리했어요.", "일상: 버스 급정거, “습관처럼 폰을 켠다”"], "증발": ["蒸(찔 증) + 發(필 발): 쪄서 날아감.", "일상: 젖은 빨래가 마름 · 표현: “용돈이 증발했다”"], "사건의 지평선": ["지평선은 땅과 하늘이 만나는 선, 그 너머는 보이지 않아요. 블랙홀의 경계를 이렇게 불러요.", "노래: 윤하의 「사건의 지평선」 · 표현: 돌아올 수 없는 선"]};
  W.forEach(function(d){ var x=WX[d.w]; if(x){ d.or=x[0]; d.use=x[1]; } });

      return '<span class="ln">'+names[l]+' '+who+'</span><span class="q">'+Q[l]+'</span>'+
        '<textarea class="mine-ans" data-l="'+l+'" rows="2">'+esc(v)+'</textarea>'; }
    var body= l===1?'<b>뿌리</b> · '+esc(d.or||'')+'<br><b>교과서</b> · '+esc(d.m)+(d.p?'<br><b>특징</b> · '+esc(d.p):'') : l===2?esc(d.use||d.r) : l===3?esc(d.r) : l===4?'요즘 나는 "'+esc(d.w)+'" 같다 → '+esc(d.x) : '<span class="q">'+esc(d.me)+' 그때 들린 소리는?</span><br><br><b>🎵 음악으로 잇는다면</b> · '+esc(d.mu);
    return '<span class="ln">'+names[l]+' '+who+'</span>'+body;
  }
  function paintRings(){ document.querySelectorAll('#onion circle').forEach(function(c){ var l=+c.dataset.l;
      c.style.opacity = l<opened ? .18 : (l<=opened+1 ? 1 : .35);
      c.style.strokeWidth = l===opened ? 7 : 3; c.style.stroke = l===opened ? '#15132b' : '#fff';
      c.style.strokeDasharray = l<opened ? '6 6' : ''; });
    if(motion&&opened){ var cc=document.querySelector('#onion circle[data-l="'+opened+'"]'); gsap.fromTo(cc,{scale:1.06,transformOrigin:'50% 50%'},{scale:1,duration:.5,ease:'back.out(3)'}); }
    var b=$('o-all'); if(b) b.textContent = opened>=5 ? '↺ 처음부터 다시' : '▶ 한 겹 펼치기 ('+opened+'/5)';
    var bk=$('o-back'); if(bk){ bk.disabled=opened<1; bk.style.opacity=opened<1?.4:1; } }
  function openLayer(l){ var d=getWord(S.word); opened=l; $('o-out').innerHTML=layerHtml(d,l); paintRings(); if(motion) gsap.fromTo('#o-out',{y:8,opacity:0},{y:0,opacity:1,duration:.35}); }
  function drawOnion(){ clearTimeout(revealT); var d=getWord(S.word); $('mine').classList.toggle('on',!!d.mine); if(d.mine&&!$('mine-in').value) $('mine-in').value=d.w; $('o-word').textContent=d.w; $('o-unit').textContent=d.s+' · '+d.u; opened=0; paintRings(); $('o-out').innerHTML='양파의 <b>가장 바깥 겹</b>을 눌러 보세요. 안쪽으로 갈수록 나만의 이야기가 나와요.'; }
  $('onion').addEventListener('click',function(e){ var c=e.target.closest('circle'); if(!c) return; var l=+c.dataset.l; if(l>opened+1){ $('o-out').innerHTML='바깥 겹부터 차례로! 지금은 <b>'+(opened+1)+'번째 겹</b>을 눌러요.'; return; } openLayer(l); });
  $('o-back').addEventListener('click',function(){ if(opened<1) return;
    if(opened===1){ opened=0; paintRings(); $('o-out').innerHTML='양파의 <b>가장 바깥 겹</b>을 눌러 보세요. 안쪽으로 갈수록 나만의 이야기가 나와요.'; return; }
    openLayer(opened-1); });
  $('o-all').addEventListener('click',function(){
    if(opened>=5){ opened=0; paintRings(); $('o-out').innerHTML='양파의 <b>가장 바깥 겹</b>부터 다시 펼쳐요.'; return; }
    openLayer(opened+1);
    if(window.innerWidth<=1000) $('o-out').scrollIntoView({behavior:'smooth',block:'nearest'}); });
  $('o-keep').addEventListener('click',function(){ var btn=this, t=cardText(getWord(S.word));
    var done=function(msg){ btn.textContent=msg; setTimeout(function(){ btn.textContent='📋 복사하기'; },1800); };
    var fb=function(){ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done('✅ 복사했어요!'); }catch(err){ done('복사가 안 돼요'); } document.body.removeChild(ta); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ done('✅ 복사했어요!'); },fb); else fb(); });

  /* ═════════ 복사할 내용 ═════════ */
  function cardText(d){
    if(d.mine){ var A=(S.mineAns||{})[d.w]||{}, a=function(k){ return (A[k]||'').trim(); };
      return ['■ 나의 씨앗: '+d.w,'','· ① 뜻과 뿌리 (글자 풀이, 교과서 뜻, 특징): '+a(1),'· ② 쓰임 (교과서 말고 어디서 들어 봤나): '+a(2),'· ③ 짝꿍 (반대이거나 짝을 이루는 것): '+a(3),'· ④ 은유: 요즘 나는 "'+d.w+'" 같다 → '+a(4),'· ⑤ 나 (딱 맞았던 내 하루, 그때 들린 소리): '+a(5),'','→ ①②③은 AI·사전 도움 OK, ④⑤는 내 말로 써요'].join(String.fromCharCode(10)); }
    return ['■ 나의 씨앗: '+d.w,'','· 어디서: '+d.s+' · '+d.u,'· ① 뿌리: '+(d.or||''),'· ① 뜻: '+d.m,'· ① 특징: '+(d.p||''),'· ② 쓰임: '+(d.use||''),
      '· ③ 짝꿍 예시: '+d.r,'· ④ 은유 예시: 요즘 나는 "'+d.w+'" 같다 → '+d.x,'· ⑤ 나에게 물어볼 질문: '+d.me+' 그때 들린 소리는?','',
      '→ ④ 은유 ⑤ 나는 내 말로 다시 써요'].join(String.fromCharCode(10));
  }

  /* ═════════ 슬라이드 이동 ═════════ */
  var slides=[].slice.call(document.querySelectorAll('.slide')), cur=0;
  function animIn(sl){ if(!motion) return; var it=sl.querySelectorAll('[data-in]'); if(it.length) gsap.fromTo(it,{y:18,opacity:0},{y:0,opacity:1,duration:.5,stagger:.06,ease:'power2.out'}); }
  function go(n){ n=Math.max(0,Math.min(slides.length-1,n)); if(n!==cur) clearTimeout(revealT); cur=n;
    slides.forEach(function(s,i){ s.classList.toggle('active',i===n); s.classList.toggle('prev',i<n); s.setAttribute('aria-hidden',i===n?'false':'true'); });
    $('num').textContent=(n+1)+' / '+slides.length; $('prev').disabled=n===0; $('next').disabled=n===slides.length-1; slides[n].scrollTop=0; animIn(slides[n]);
    }
  $('prev').addEventListener('click',function(){go(cur-1);}); $('next').addEventListener('click',function(){go(cur+1);});
  document.addEventListener('keydown',function(e){ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return; if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1);} else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);} });
  var sx=null,sy=null;
  document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',function(e){ if(sx===null) return; if(e.target.closest('input,textarea')){ sx=null; return; } var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) go(cur+(dx<0?1:-1)); sx=null; });

  drawWords(); drawOnion(); go(0);
})();
</script>
</body>
</html>
